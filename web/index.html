<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20/10 yêu thương</title>
    <style>
    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: Arial, Tahoma, sans-serif;
        scrollbar-width: none;
    }

    body {
        height: 100vh;
        height: 100dvh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to top, #ffdde1, #ee9ca7);
        -webkit-text-size-adjust: 100%;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .love-card::-webkit-scrollbar { display: none; }

    #playBtn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(88vw, 420px);
        min-height: 68px;
        padding: 18px 22px;
        border: 0;
        border-radius: 12px;
        background: #ff4d6d;
        color: #fff;
        font-size: clamp(20px, 5.5vw, 25px);
        line-height: 1.5;
        cursor: pointer;
        z-index: 1000;
        box-shadow: 0 6px 15px rgba(0,0,0,.3);
    }

    #playBtn:hover { background: #ff3355; }

    /* Ảnh nền bay */
    .floating-img {
        position: absolute;
        bottom: -200px;
        width: 160px;
        max-width: 44vw;
        height: auto;
        object-fit: contain;
        pointer-events: none;
        animation: floatUp 30s linear forwards;
    }

    @keyframes floatUp {
        from { transform: translateY(0) scale(.8); opacity: 0; }
        10%, 85% { opacity: 1; }
        to { transform: translateY(-130vh) scale(1); opacity: 0; }
    }

    /* Trái tim nền, nếu JavaScript có tạo */
    .heart {
        position: absolute;
        width: 20px;
        height: 20px;
        background: red;
        transform: rotate(-45deg);
        animation: floatHeart 6s linear infinite;
        pointer-events: none;
    }

    .heart::before, .heart::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: red;
    }

    .heart::before { top: -10px; left: 0; }
    .heart::after { top: 0; left: 10px; }

    @keyframes floatHeart {
        from { transform: translateY(0) rotate(-45deg) scale(.5); opacity: 0; }
        30% { opacity: 1; }
        to { transform: translateY(-200px) rotate(-45deg) scale(1); opacity: 0; }
    }

    /* Lời chúc bay nền */
    .message {
        position: absolute;
        width: max-content;
        max-width: 88vw;
        padding: 8px 12px;
        color: #fff;
        font-size: clamp(19px, 5vw, 25px);
        font-weight: bold;
        line-height: 1.6;
        text-align: center;
        overflow-wrap: anywhere;
        text-shadow: 1px 1px 5px rgba(0,0,0,.5);
        pointer-events: none;
        animation: floatMsg 26s linear forwards;
    }

    @keyframes floatMsg {
        from { transform: translateY(100vh); opacity: 0; }
        15% { opacity: 1; }
        to { transform: translateY(-120vh); opacity: 0; }
    }

    /* Lớp phủ thiệp: đứng yên, không có animation */
    .card-overlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
        background: rgba(65, 31, 43, .48);
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        opacity: 1;
        transform: none;
    }

    /* Phong bì trước khi mở: không đung đưa */
    .envelope {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: min(460px, 92vw);
        aspect-ratio: 1.45;
        border: 1px solid #d9b77b;
        border-radius: 5px;
        background: linear-gradient(145deg, #fff8e9, #f1d8bd);
        box-shadow: 0 18px 55px rgba(30, 10, 20, .3);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        animation: none !important;
        transform: none !important;
    }

    .envelope::before {
        content: "";
        position: absolute;
        inset: 9px;
        border: 1px solid #d9b77b;
        pointer-events: none;
    }

    .envelope-content {
        position: relative;
        z-index: 2;
        padding: 16px;
        color: #884b55;
        text-align: center;
    }

    .envelope-flower { font-size: 52px; margin-bottom: 10px; }

    .envelope-title {
        margin: 0 0 12px;
        font-size: clamp(27px, 7vw, 36px);
        font-weight: normal;
        line-height: 1.4;
    }

    .envelope-hint { color: #966d68; font-size: 20px; line-height: 1.6; }

    /* Thiệp đã mở: cố định vị trí, không có animation/transform */
    .love-card {
        position: relative;
        width: 100%;
        max-width: 600px;
        max-height: 88vh;
        max-height: 88dvh;
        padding: 34px 28px;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        border: 1px solid #d9b77b;
        border-radius: 5px;
        background: linear-gradient(145deg, #fffdf7, #f8e8db);
        box-shadow: 0 20px 60px rgba(30, 10, 20, .28);
        color: #70434b;
        text-align: center;
        opacity: 1 !important;
        transform: none !important;
        animation: none !important;
        transition: none !important;
    }

    .love-card::before {
        content: "";
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(190, 143, 87, .45);
        pointer-events: none;
    }

    .card-flower { margin-bottom: 16px; font-size: 44px; animation: none !important; }

    .card-title {
        margin: 0 0 24px;
        color: #a64f61;
        font-size: clamp(29px, 6vw, 36px);
        font-weight: bold;
        line-height: 1.5;
    }

    .card-message {
        font-size: clamp(21px, 4.8vw, 25px);
        line-height: 1.9;
        text-align: left;
        white-space: pre-line;
        overflow-wrap: anywhere;
    }

    .card-signature {
        margin-top: 26px;
        color: #a64f61;
        font-size: clamp(22px, 5vw, 27px);
        font-weight: bold;
        line-height: 1.8;
    }

    .card-close {
        position: relative;
        z-index: 2;
        width: 100%;
        min-height: 58px;
        margin-top: 24px;
        padding: 15px 18px;
        border: 0;
        border-radius: 24px;
        background: #a64f61;
        color: #fff;
        font-size: 20px;
        line-height: 1.5;
        cursor: pointer;
    }

    .card-close:hover { background: #85394b; }

    @media (max-width: 480px) {
        .love-card { padding: 28px 20px; max-height: 88dvh; }
        .card-title { font-size: 29px; line-height: 1.5; }
        .card-message { font-size: 22px; line-height: 1.9; }
        .card-signature { font-size: 23px; line-height: 1.8; }
        .floating-img { max-width: 44vw; }
    }
</style>
</head>
<body>

    <!-- Nhạc nền -->
    <audio id="bgMusic" loop>
        <source src="tangme.mp3" type="audio/mpeg">
    </audio>

    <!-- Nút bấm -->
    <button id="playBtn">🌕 Mẹ bấm vào đây đi mẹ 🌸</button>

    <script>
        const messages = [
            "❤️ Chúc mẹ yêu của con luôn mạnh khỏe, bình an và hạnh phúc ạ!",
            "🌷 Mong mẹ mỗi ngày đều vui vẻ, nở nụ cười thật tươi!",
            "✨ Chúc mẹ của con luôn gặp thật nhiều may mắn và những điều tốt đẹp!",
            "💖 Mong mẹ bớt lo toan, bớt vất vả, cả nhà luôn yêu thương mẹ ạ!",
            "🥰 Mẹ mãi là người phụ nữ tuyệt vời nhất trong lòng con!",
            "🌸 Chúc mẹ của con lúc nào cũng rạng rỡ và tràn đầy sức sống!",
            "🫶 Mọi điều dịu dàng và tốt đẹp nhất sẽ luôn đến với mẹ!",
            "☀️ Chúc mỗi ngày của mẹ đều ngập tràn niềm vui và tiếng cười!",
            "🍀 Mong mẹ con luôn bình an, gặp nhiều may mắn và vạn sự như ý!",
            "💐 Chúc mẹ của con có thật nhiều sức khỏe để sống vui vẻ bên gia đình!",
            "💕 Cảm ơn mẹ vì đã luôn yêu thương, chăm sóc và lo lắng cho con!",
            "🌈 Chúc những muộn phiền của mẹ vơi đi, nhường chỗ cho những niềm vui!",
            "🕊️ Mong mẹ của con luôn an yên trong lòng, nhẹ nhàng trong cuộc sống!",
            "🌹 Chúc mẹ luôn luôn xinh đẹp, hạnh phúc và thật dịu dàng!",
            "💗 Con mong mình ngày càng trưởng thành để mẹ có thể yên tâm và tự hào!",
            "🧸 Mẹ nhớ ăn uống đầy đủ, nghỉ ngơi nhiều hơn và đừng làm việc quá sức nhé!",
            "🌻 Chúc mẹ con luôn có thật nhiều lý do để mỉm cười mỗi ngày!",
            "🎀 Mong những điều mẹ mong ước sẽ đều dần trở thành hiện thực!",
            "🏡 Chúc cả gia đình mình luôn ấm áp, bình an và ngập tràn tiếng cười!",
            "💝 Dù lớn đến đâu, con vẫn luôn muốn được mẹ yêu thương và chở che!",
            "🌙 Mong mẹ ngủ ngon mỗi tối, thức dậy mỗi sáng với một tâm trạng thật vui!",
            "🩷 Mẹ hãy yêu thương bản thân mình nhiều như cách mẹ luôn yêu thương cả nhà nhé ạ!",
            "💞 Với con, được nhìn thấy mẹ vui vẻ và khỏe mạnh đã là một món quà quý giá!",
            "✨ Chúc người mẹ tuyệt vời nhất của con một ngày 20/10 thật trọn vẹn!",
            "❤️ Con yêu mẹ nhiều lắm, hôm nay và cả những ngày bình thường sau này nữa!"
        ];

        const images = [
            "me1.jpg",
            "me2.jpg",
            "me3.jpg",
            "me4.jpg",
            "me5.jpg",
            "me6.jpg",
            "me7.jpg",
            "me8.jpg",
            "me9.jpg",
            "me10.jpg",
            "me11.jpg",
            "me12.jpg",
            "me13.jpg",
            "me14.jpg"
        ];

        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            document.body.appendChild(heart);

            heart.style.left = Math.random() * window.innerWidth + "px";
            const size = Math.random() * 15 + 10;
            heart.style.width = size + "px";
            heart.style.height = size + "px";
            heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

            setTimeout(() => heart.remove(), 7000);
        }


        function createImage() {
            const img = document.createElement("img");
            img.src = images[Math.floor(Math.random() * images.length)];
            img.className = "floating-img";

            // Ảnh lớn hơn, tự điều chỉnh theo màn hình
            const maxSize = Math.min(180, window.innerWidth * 0.44);
            const minSize = Math.min(110, maxSize);
            const size = minSize + Math.random() * (maxSize - minSize);

            img.style.width = size + "px";
            img.style.left = Math.max(
                0,
                Math.random() * (window.innerWidth - size)
            ) + "px";

            img.style.animationDuration = (Math.random() * 10 + 24) + "s";
            document.body.appendChild(img);

            setTimeout(() => img.remove(), 36000);
        }



        function createMessage() {
            const msg = document.createElement("div");
            msg.className = "message";
            msg.textContent = messages[
                Math.floor(Math.random() * messages.length)
            ];

            document.body.appendChild(msg);

            const maxLeft = Math.max(0, window.innerWidth - msg.offsetWidth);
            msg.style.left = Math.random() * maxLeft + "px";
            msg.style.animationDuration = (Math.random() * 8 + 20) + "s";

            setTimeout(() => msg.remove(), 30000);
        }




        function showLoveCard() {
            if (document.querySelector(".card-overlay")) return;

            const overlay = document.createElement("div");
            overlay.className = "card-overlay";

            // Phong bì đóng: mẹ chạm vào để mở
            const envelope = document.createElement("div");
            envelope.className = "envelope";
            envelope.setAttribute("role", "button");
            envelope.setAttribute("tabindex", "0");
            envelope.setAttribute("aria-label", "Chạm để mở thiệp tặng mẹ");

            envelope.innerHTML = `
        <div class="envelope-content">
            <div class="envelope-flower">🌷</div>
            <h2 class="envelope-title">Gửi mẹ yêu của con</h2>
            <div class="envelope-hint">♡  mẹ bấm vào đi ạ ♡</div>
        </div>
    `;

            function openCard() {
                if (!overlay.contains(envelope)) return;

                const card = document.createElement("div");
                card.className = "love-card";

                const flower = document.createElement("div");
                flower.className = "card-flower";
                flower.textContent = "🌷";

                const title = document.createElement("h2");
                title.className = "card-title";
                title.textContent = "Gửi mẹ yêu của con ❤️";

                const message = document.createElement("div");
                message.className = "card-message";
                message.textContent =
                    "Nhân ngày 20/10, con chúc mẹ luôn mạnh khỏe, bình an, vui vẻ và lúc nào cũng nở nụ cười trên môi. Con mong những điều tốt đẹp nhất lúc nào cũng đến với mẹ của con, mong mẹ bớt lo toan, bớt vất vả và luôn luôn hạnh phúc ạ.\n\n" +
                    "Con chỉ mong mình ngày càng trưởng thành để có thể san sẻ với mẹ nhiều hơn và khiến mẹ yên lòng. Mẹ nhớ giữ gìn sức khỏe ạ, mẹ đừng làm quá sức và hãy luôn vui vẻ nhé ạ!\n\n" +
                    "Với con, mẹ luôn là người phụ nữ tuyệt vời nhất quả đất.";

                const signature = document.createElement("div");
                signature.className = "card-signature";
                signature.textContent = "Chúc mừng ngày 20/10 — Con yêu mẹ nhiều lắm! ❤️";

                const close = document.createElement("button");
                close.className = "card-close";
                close.textContent = "Mẹ đọc xong rồi ❤️";
                close.addEventListener("click", () => {
                    overlay.style.transition = "opacity 0.5s ease";
                    overlay.style.opacity = "0";
                    setTimeout(() => overlay.remove(), 500);
                });

                card.append(flower, title, message, signature, close);
                envelope.replaceWith(card);
            }

            envelope.addEventListener("click", openCard);
            envelope.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openCard();
                }
            });

            overlay.appendChild(envelope);
            document.body.appendChild(overlay);
        }




        document.getElementById("playBtn").addEventListener("click", () => {
            const music = document.getElementById("bgMusic");

            // Thử phát nhạc; hiệu ứng vẫn chạy nếu nhạc lỗi
            music.play().catch(e => {
                console.log("Không phát được nhạc:", e);
            });

            document.getElementById("playBtn").style.display = "none";

            // Khởi chạy các hiệu ứng hiện tại
            createHeart();
            createImage();
            createMessage();

            setInterval(createHeart, 600);
            setInterval(createImage, 5000);
            setInterval(createMessage, 8000);

            // Hiện thiệp sau 30 giây kể từ khi mẹ bấm nút
            setTimeout(showLoveCard, 30000);
        });

    </script>

</body>
</html>

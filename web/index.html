<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20/10 yêu thương</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(to top, #ffdde1, #ee9ca7);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            font-family: Arial, Tahoma, sans-serif;
        }

        /* Nút bấm */
        #playBtn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 22px;
            background: #ff4d6d;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        }

            #playBtn:hover {
                background: #ff3355;
            }

        /* Hình ảnh bay */
        .floating-img {
            position: absolute;
            width: 120px;
            animation: floatUp 24s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.8);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh) scale(1);
                opacity: 0;
            }
        }

        /* Trái tim */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            transform: rotate(-45deg);
            animation: floatHeart 6s linear infinite;
        }

            .heart::before,
            .heart::after {
                content: "";
                position: absolute;
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background: red;
            }

            .heart::before {
                top: -10px;
                left: 0;
            }

            .heart::after {
                left: 10px;
                top: 0;
            }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(-45deg) scale(0.5);
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            100% {
                transform: translateY(-200px) rotate(-45deg) scale(1);
                opacity: 0;
            }
        }

        /* Câu chúc */
        .message {
            position: absolute;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
            animation: floatMsg 10s linear forwards;
        }

        @keyframes floatMsg {
            0% {
                transform: translateY(100vh);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh);
                opacity: 0;
            }
        }


        /* Lớp phủ khi thiệp xuất hiện */
        .card-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(74, 29, 45, 0.35);
            backdrop-filter: blur(5px);
            opacity: 0;
            animation: overlayIn 1.2s ease forwards;
        }

        /* Tấm thiệp */
        .love-card {
            position: relative;
            width: min(420px, 100%);
            max-height: 82vh;
            overflow-y: auto;
            box-sizing: border-box;
            padding: 36px 26px;
            border: 1px solid #e8c78e;
            border-radius: 5px;
            background: radial-gradient(ellipse at top, #fffdf7, transparent 75%), linear-gradient(145deg, #fffaf0, #f9e8dc);
            box-shadow: 0 20px 70px rgba(65, 24, 37, 0.3);
            color: #70434b;
            text-align: center;
            transform: translateY(35px) scale(0.88);
            opacity: 0;
            animation: cardReveal 1.4s cubic-bezier(.2,.8,.2,1) .2s forwards;
        }

            .love-card::before {
                content: "";
                position: absolute;
                inset: 8px;
                border: 1px solid rgba(190, 143, 87, 0.5);
                pointer-events: none;
            }

        .card-flower {
            font-size: 34px;
            margin-bottom: 12px;
            animation: flowerSway 3s ease-in-out infinite;
        }

        .card-title {
            margin: 0 0 20px;
            font-family: Arial, Tahoma, sans-serif;
            font-size: 27px;
            font-weight: normal;
            color: #a64f61;
        }

        .card-message {
            font-family: Arial, Tahoma, sans-serif;
            font-size: 16px;
            line-height: 1.9;
            white-space: pre-line;
            text-align: left;
        }

        .card-signature {
            margin-top: 22px;
            font-family: Arial, Tahoma, sans-serif;
            font-size: 19px;
            font-style: italic;
            color: #a64f61;
        }

        .card-close {
            position: relative;
            z-index: 1;
            margin-top: 22px;
            padding: 10px 24px;
            border: 1px solid #c58a91;
            border-radius: 30px;
            background: #a64f61;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

            .card-close:hover {
                background: #85394b;
            }

        @keyframes overlayIn {
            to {
                opacity: 1;
            }
        }

        @keyframes cardReveal {
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes flowerSway {
            0%, 100% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(5deg);
            }
        }

        @media (max-width: 480px) {
            .love-card {
                padding: 32px 22px;
                max-height: 80vh;
            }

            .card-title {
                font-size: 24px;
            }

            .card-message {
                font-size: 15px;
            }
        }


        /* Lớp phủ tương thích với màn hình điện thoại */
        .card-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            background: rgba(65, 31, 43, 0.48);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            animation: overlayIn 0.8s ease forwards;
        }

        /* Phong bì trước khi mở */
        .envelope {
            width: min(340px, 88vw);
            aspect-ratio: 1.45;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #d9b77b;
            border-radius: 5px;
            background: linear-gradient(145deg, #fff8e9, #f1d8bd);
            box-shadow: 0 18px 55px rgba(30, 10, 20, 0.3);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            animation: none !important;
        }

            .envelope::before {
                content: "";
                position: absolute;
                inset: 9px;
                border: 1px solid #d9b77b;
                pointer-events: none;
            }

        .envelope-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #884b55;
            padding: 12px;
        }

        .envelope-flower {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .envelope-title {
            font-family: Arial, Tahoma, sans-serif;
            font-size: clamp(20px, 6vw, 26px);
            font-weight: normal;
            margin: 0 0 12px;
        }

        .envelope-hint {
            font-size: 14px;
            color: #966d68;
        }

        /* Nội dung thiệp sau khi mở */
        .love-card {
            position: relative;
            width: 100%;
            max-width: 430px;
            max-height: 82vh;
            max-height: 82dvh;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
            padding: 30px 24px;
            border: 1px solid #d9b77b;
            background: linear-gradient(145deg, #fffdf7, #f8e8db);
            box-shadow: 0 20px 60px rgba(30, 10, 20, 0.28);
            color: #70434b;
            text-align: center;
            opacity: 0;
            transform: translateY(20px) scale(0.94);
            animation: cardReveal 0.9s ease forwards;
        }

            .love-card::before {
                content: "";
                position: absolute;
                inset: 7px;
                border: 1px solid rgba(190, 143, 87, 0.45);
                pointer-events: none;
            }

        .card-flower {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .card-title {
            font-family: Arial, Tahoma, sans-serif;
            font-size: clamp(22px, 6vw, 27px);
            font-weight: normal;
            color: #a64f61;
            margin: 0 0 20px;
        }

        .card-message {
            font-family: Arial, Tahoma, sans-serif;
            font-size: 16px;
            line-height: 1.8;
            white-space: pre-line;
            overflow-wrap: anywhere;
            text-align: left;
        }

        .card-signature {
            font-family: Arial, Tahoma, sans-serif;
            font-size: 17px;
            line-height: 1.6;
            margin-top: 20px;
            color: #a64f61;
        }

        .card-close {
            position: relative;
            z-index: 2;
            margin-top: 20px;
            padding: 12px 20px;
            min-height: 44px;
            border: 0;
            border-radius: 24px;
            background: #a64f61;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        @keyframes overlayIn {
            to {
                opacity: 1;
            }
        }

        @keyframes envelopeFloat {
            0%, 100% {
                transform: translateY(0) rotate(-1deg);
            }

            50% {
                transform: translateY(-8px) rotate(1deg);
            }
        }

        @keyframes cardReveal {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 480px) {
            .love-card {
                padding: 25px 20px;
                max-height: 78vh;
                max-height: 78dvh;
            }

            .card-message {
                font-size: 15px;
                line-height: 1.75;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .envelope {
                animation: none;
            }
        }


        html, body {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

            html::-webkit-scrollbar,
            body::-webkit-scrollbar,
            .love-card::-webkit-scrollbar {
                display: none;
            }

        .love-card {
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }


        /* ===== TỐI ƯU THIỆP CHO ĐIỆN THOẠI ===== */

        html {
            width: 100%;
            height: 100%;
            scrollbar-width: none;
        }

        body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: Arial, Tahoma, sans-serif;
            -webkit-text-size-adjust: 100%;
        }

        /* Nút bắt đầu */
        #playBtn {
            width: min(88vw, 420px);
            min-height: 68px;
            padding: 18px 22px;
            font-size: clamp(20px, 5.5vw, 25px);
            line-height: 1.5;
            box-sizing: border-box;
        }

        /* Ảnh bay: tăng kích thước mặc định */
        .floating-img {
            width: 160px;
            max-width: 42vw;
            height: auto;
            object-fit: contain;
        }

        /* Lời chúc bay: chữ lớn, dễ đọc */
        .message {
            width: max-content;
            max-width: 88vw;
            box-sizing: border-box;
            padding: 8px 12px;
            font-size: clamp(19px, 5vw, 25px);
            line-height: 1.6;
            text-align: center;
            overflow-wrap: anywhere;
        }

        /* Lớp phủ thiệp */
        .card-overlay {
            padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            overflow: hidden;
        }

        /* Phong bì trước khi mở */
        .envelope {
            width: min(460px, 92vw);
        }

        .envelope-content {
            padding: 16px;
        }

        .envelope-flower {
            font-size: 52px;
        }

        .envelope-title {
            font-family: Arial, Tahoma, sans-serif;
            font-size: clamp(27px, 7vw, 36px);
            line-height: 1.4;
        }

        .envelope-hint {
            font-size: 20px;
            line-height: 1.6;
        }

        /* Thiệp sau khi mở */
        .love-card {
            width: 100%;
            max-width: 600px;
            max-height: 88vh;
            max-height: 88dvh;
            padding: 34px 28px;
            box-sizing: border-box;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

            .love-card::-webkit-scrollbar {
                display: none;
            }

        /* Hoa trang trí */
        .card-flower {
            font-size: 44px;
            margin-bottom: 16px;
        }

        /* Tiêu đề */
        .card-title {
            font-family: Arial, Tahoma, sans-serif;
            font-size: clamp(29px, 6vw, 36px);
            line-height: 1.5;
            font-weight: bold;
            margin-bottom: 24px;
        }

        /* Nội dung lời chúc */
        .card-message {
            font-family: Arial, Tahoma, sans-serif;
            font-size: clamp(21px, 4.8vw, 25px);
            line-height: 1.9;
            text-align: left;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        /* Chữ ký cuối thiệp */
        .card-signature {
            font-family: Arial, Tahoma, sans-serif;
            font-size: clamp(22px, 5vw, 27px);
            line-height: 1.8;
            font-weight: bold;
            margin-top: 26px;
        }

        /* Nút đóng thiệp */
        .card-close {
            width: 100%;
            min-height: 58px;
            padding: 15px 18px;
            font-size: 20px;
            line-height: 1.5;
            margin-top: 24px;
        }

        /* Điện thoại nhỏ */
        @media (max-width: 480px) {
            .love-card {
                padding: 28px 20px;
                max-height: 88dvh;
            }

            .card-title {
                font-size: 29px;
                line-height: 1.5;
            }

            .card-message {
                font-size: 22px;
                line-height: 1.9;
            }

            .card-signature {
                font-size: 23px;
                line-height: 1.8;
            }

            .floating-img {
                max-width: 44vw;
            }
        }

    </style>
</head>
<body>

    <!-- Nhạc nền -->
    <audio id="bgMusic" loop>
        <source src="tangme.mp3" type="audio/mpeg">
    </audio>

    <!-- Nút bấm -->
    <button id="playBtn">🌕 Mẹ bấm vào đây đi mẹ 🌸</button>

    <script>
        const messages = [
            "❤️ Chúc mẹ yêu của con luôn mạnh khỏe, bình an và hạnh phúc ạ!",
            "🌷 Mong mẹ mỗi ngày đều vui vẻ, nở nụ cười thật tươi!",
            "✨ Chúc mẹ của con luôn gặp thật nhiều may mắn và những điều tốt đẹp!",
            "💖 Mong mẹ bớt lo toan, bớt vất vả, cả nhà luôn yêu thương mẹ ạ!",
            "🥰 Mẹ mãi là người phụ nữ tuyệt vời nhất trong lòng con!",
            "🌸 Chúc mẹ của con lúc nào cũng rạng rỡ và tràn đầy sức sống!",
            "🫶 Mọi điều dịu dàng và tốt đẹp nhất sẽ luôn đến với mẹ!",
            "☀️ Chúc mỗi ngày của mẹ đều ngập tràn niềm vui và tiếng cười!",
            "🍀 Mong mẹ con luôn bình an, gặp nhiều may mắn và vạn sự như ý!",
            "💐 Chúc mẹ của con có thật nhiều sức khỏe để sống vui vẻ bên gia đình!",
            "💕 Cảm ơn mẹ vì đã luôn yêu thương, chăm sóc và lo lắng cho con!",
            "🌈 Chúc những muộn phiền của mẹ vơi đi, nhường chỗ cho những niềm vui!",
            "🕊️ Mong mẹ của con luôn an yên trong lòng, nhẹ nhàng trong cuộc sống!",
            "🌹 Chúc mẹ luôn luôn xinh đẹp, hạnh phúc và thật dịu dàng!",
            "💗 Con mong mình ngày càng trưởng thành để mẹ có thể yên tâm và tự hào!",
            "🧸 Mẹ nhớ ăn uống đầy đủ, nghỉ ngơi nhiều hơn và đừng làm việc quá sức nhé!",
            "🌻 Chúc mẹ con luôn có thật nhiều lý do để mỉm cười mỗi ngày!",
            "🎀 Mong những điều mẹ mong ước sẽ đều dần trở thành hiện thực!",
            "🏡 Chúc cả gia đình mình luôn ấm áp, bình an và ngập tràn tiếng cười!",
            "💝 Dù lớn đến đâu, con vẫn luôn muốn được mẹ yêu thương và chở che!",
            "🌙 Mong mẹ ngủ ngon mỗi tối, thức dậy mỗi sáng với một tâm trạng thật vui!",
            "🩷 Mẹ hãy yêu thương bản thân mình nhiều như cách mẹ luôn yêu thương cả nhà nhé ạ!",
            "💞 Với con, được nhìn thấy mẹ vui vẻ và khỏe mạnh đã là một món quà quý giá!",
            "✨ Chúc người mẹ tuyệt vời nhất của con một ngày 20/10 thật trọn vẹn!",
            "❤️ Con yêu mẹ nhiều lắm, hôm nay và cả những ngày bình thường sau này nữa!"
        ];

        const images = [
            "me1.jpg",
            "me2.jpg",
            "me3.jpg",
            "me4.jpg",
            "me5.jpg",
            "me6.jpg",
            "me7.jpg",
            "me8.jpg",
            "me9.jpg",
            "me10.jpg",
            "me11.jpg",
            "me12.jpg",
            "me13.jpg",
            "me14.jpg"
        ];

        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart";
            document.body.appendChild(heart);

            heart.style.left = Math.random() * window.innerWidth + "px";
            const size = Math.random() * 15 + 10;
            heart.style.width = size + "px";
            heart.style.height = size + "px";
            heart.style.animationDuration = (Math.random() * 3 + 4) + "s";

            setTimeout(() => heart.remove(), 7000);
        }


        function createImage() {
            const img = document.createElement("img");
            img.src = images[Math.floor(Math.random() * images.length)];
            img.className = "floating-img";

            // Ảnh lớn hơn, tự điều chỉnh theo màn hình
            const maxSize = Math.min(180, window.innerWidth * 0.44);
            const minSize = Math.min(110, maxSize);
            const size = minSize + Math.random() * (maxSize - minSize);

            img.style.width = size + "px";
            img.style.left = Math.max(
                0,
                Math.random() * (window.innerWidth - size)
            ) + "px";

            img.style.animationDuration = (Math.random() * 10 + 24) + "s";
            document.body.appendChild(img);

            setTimeout(() => img.remove(), 36000);
        }



        function createMessage() {
            const msg = document.createElement("div");
            msg.className = "message";
            msg.textContent = messages[
                Math.floor(Math.random() * messages.length)
            ];

            document.body.appendChild(msg);

            const maxLeft = Math.max(0, window.innerWidth - msg.offsetWidth);
            msg.style.left = Math.random() * maxLeft + "px";
            msg.style.animationDuration = (Math.random() * 8 + 20) + "s";

            setTimeout(() => msg.remove(), 30000);
        }




        function showLoveCard() {
            if (document.querySelector(".card-overlay")) return;

            const overlay = document.createElement("div");
            overlay.className = "card-overlay";

            // Phong bì đóng: mẹ chạm vào để mở
            const envelope = document.createElement("div");
            envelope.className = "envelope";
            envelope.setAttribute("role", "button");
            envelope.setAttribute("tabindex", "0");
            envelope.setAttribute("aria-label", "Chạm để mở thiệp tặng mẹ");

            envelope.innerHTML = `
        <div class="envelope-content">
            <div class="envelope-flower">🌷</div>
            <h2 class="envelope-title">Gửi mẹ yêu của con</h2>
            <div class="envelope-hint">♡  mẹ bấm vào đi ạ ♡</div>
        </div>
    `;

            function openCard() {
                if (!overlay.contains(envelope)) return;

                const card = document.createElement("div");
                card.className = "love-card";

                const flower = document.createElement("div");
                flower.className = "card-flower";
                flower.textContent = "🌷";

                const title = document.createElement("h2");
                title.className = "card-title";
                title.textContent = "Gửi mẹ yêu của con ❤️";

                const message = document.createElement("div");
                message.className = "card-message";
                message.textContent =
                    "Nhân ngày 20/10, con chúc mẹ luôn mạnh khỏe, bình an, vui vẻ và lúc nào cũng nở nụ cười trên môi. Con mong những điều tốt đẹp nhất lúc nào cũng đến với mẹ của con, mong mẹ bớt lo toan, bớt vất vả và luôn luôn hạnh phúc ạ.\n\n" +
                    "Con chỉ mong mình ngày càng trưởng thành để có thể san sẻ với mẹ nhiều hơn và khiến mẹ yên lòng. Mẹ nhớ giữ gìn sức khỏe ạ, mẹ đừng làm quá sức và hãy luôn vui vẻ nhé ạ!\n\n" +
                    "Với con, mẹ luôn là người phụ nữ tuyệt vời nhất quả đất.";

                const signature = document.createElement("div");
                signature.className = "card-signature";
                signature.textContent = "Chúc mừng ngày 20/10 — Con yêu mẹ nhiều lắm! ❤️";

                const close = document.createElement("button");
                close.className = "card-close";
                close.textContent = "Mẹ đọc xong rồi ❤️";
                close.addEventListener("click", () => {
                    overlay.style.transition = "opacity 0.5s ease";
                    overlay.style.opacity = "0";
                    setTimeout(() => overlay.remove(), 500);
                });

                card.append(flower, title, message, signature, close);
                envelope.replaceWith(card);
            }

            envelope.addEventListener("click", openCard);
            envelope.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openCard();
                }
            });

            overlay.appendChild(envelope);
            document.body.appendChild(overlay);
        }




        document.getElementById("playBtn").addEventListener("click", () => {
            const music = document.getElementById("bgMusic");

            // Thử phát nhạc; hiệu ứng vẫn chạy nếu nhạc lỗi
            music.play().catch(e => {
                console.log("Không phát được nhạc:", e);
            });

            document.getElementById("playBtn").style.display = "none";

            // Khởi chạy các hiệu ứng hiện tại
            createHeart();
            createImage();
            createMessage();

            setInterval(createHeart, 600);
            setInterval(createImage, 2500);
            setInterval(createMessage, 4000);

            // Hiện thiệp sau 30 giây kể từ khi mẹ bấm nút
            setTimeout(showLoveCard, 30000);
        });

    </script>

</body>
</html>
